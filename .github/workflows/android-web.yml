name: Android (web)

# ウェブ版をそのまま包んだ APK を作る。
#
# 手動で回したときだけ動かす（Actions の画面の「Run workflow」）。
# できた APK は、スマホのブラウザから直接落とせるように、
# 決まった住所のリリース（apk-latest）に置き直す。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android アクションは廃止された 'tools' パッケージを掴みに行って失敗する。
      # ランナーには Android SDK が最初から入っているので、そちらを直接使う。
      - name: Android SDK を用意
        run: |
          set -eux
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK をビルド
        working-directory: android-web
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 名前をそろえる
        run: cp android-web/app/build/outputs/apk/debug/app-debug.apk fridge-map.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fridge-map-apk
          path: fridge-map.apk
          if-no-files-found: error

      # 同じ住所で最新を落とせるよう、前のリリースを消してから作り直す
      - name: リリースに置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest fridge-map.apk \
            --title "冷蔵庫の地図 APK（最新）" \
            --notes "ウェブ版をそのまま包んだ Android アプリです。$(date -u +%Y-%m-%d) に ${GITHUB_SHA::7} から作りました。" \
            --target "$GITHUB_SHA"
