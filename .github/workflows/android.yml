name: Android

# 開発者の手元に Android SDK が無くても APK を受け取れるようにする。
#
# 手動で回したときだけ動かす。APK が要るのは実機やエミュレータで触るときだけで、
# push のたびに回しても誰も受け取らない APK が積まれるだけになる。
# Actions の画面の「Run workflow」から実行する。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android アクションは廃止された 'tools' パッケージを掴みに行って失敗する。
      # ランナーには Android SDK が最初から入っているので、そちらを直接使う。
      - name: Android SDK を用意
        run: |
          set -eux
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: ユニットテスト
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: debug APK をビルド
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fridge-keeper-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
